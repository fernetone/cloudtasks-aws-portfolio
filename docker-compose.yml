services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudtasks
      POSTGRES_USER: cloudtasks
      POSTGRES_PASSWORD: cloudtasks
    ports:
      - "5432:5432"
    volumes:
      - cloudtasks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtasks -d cloudtasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://cloudtasks:cloudtasks@db:5432/cloudtasks
      DATABASE_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  cloudtasks_pgdata:
