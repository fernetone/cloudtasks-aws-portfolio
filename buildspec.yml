version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - echo "Installing dependencies"
      - npm ci --no-audit --no-fund

  pre_build:
    commands:
      - echo "Running quality gate"
      - npm run verify
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME"
      - IMAGE_TAG="pipeline-$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
      - echo "Using immutable image tag $IMAGE_TAG"
      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"

  build:
    commands:
      - echo "Building Docker image"
      - docker build -t "$IMAGE_REPO_NAME:$IMAGE_TAG" .
      - docker tag "$IMAGE_REPO_NAME:$IMAGE_TAG" "$ECR_URI:$IMAGE_TAG"

  post_build:
    commands:
      - test "${CODEBUILD_BUILD_SUCCEEDING:-0}" -eq 1
      - echo "Pushing immutable Docker image"
      - docker push "$ECR_URI:$IMAGE_TAG"
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$ECR_URI:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
