name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests, build and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cloudtasks
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: cloudtasks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudtasks -d cloudtasks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://cloudtasks:${{ github.run_id }}@127.0.0.1:5432/cloudtasks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify project
        run: npm run verify

      - name: Validate production container build
        run: docker build --tag cloudtasks:ci .

  powershell:
    name: PowerShell 5.1 script regressions
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate script syntax
        shell: powershell
        run: .\scripts\localstack\validate-scripts.ps1
      - name: Run isolated script regressions
        shell: powershell
        run: .\scripts\tests\test-regressions.ps1
